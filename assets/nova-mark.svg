    <circle cx="153" cy="38" r="5" fill="#FFCA78"/>
    <circle cx="34" cy="143" r="4" fill="#45D6FF"/>
  </g>
  <g font-family="Inter, Segoe UI, Roboto, Arial, sans-serif">
    <text x="220" y="112" font-size="86" font-weight="750" letter-spacing="9" fill="#F2F6FF">NOVA</text>
    <path d="M224 132H640" stroke="url(#novaOrbit)" stroke-width="2" opacity=".7"/>
    <text x="225" y="166" font-size="23" font-weight="600" letter-spacing="8" fill="#9AA8BE">RUNTIME</text>
    <text x="638" y="166" font-size="12" font-weight="600" letter-spacing="2" text-anchor="end" fill="#45D6FF">ENGINEERING</text>
