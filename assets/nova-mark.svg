<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">NOVA Runtime</title>
  <desc id="desc">NOVA Runtime original orbital N symbol and wordmark.</desc>
  <defs>
    <linearGradient id="novaCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45D6FF"/>
      <stop offset="0.55" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#FFCA78"/>
    </linearGradient>
    <linearGradient id="novaOrbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45D6FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 0)">
    <circle cx="94" cy="96" r="73" fill="none" stroke="#45D6FF" stroke-opacity=".24" stroke-width="2"/>
    <ellipse cx="94" cy="96" rx="86" ry="42" fill="none" stroke="url(#novaOrbit)" stroke-width="3" stroke-linecap="round" transform="rotate(-28 94 96)" stroke-dasharray="330 210"/>
    <path d="M50 139V53L138 139V53" fill="none" stroke="url(#novaCore)" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
