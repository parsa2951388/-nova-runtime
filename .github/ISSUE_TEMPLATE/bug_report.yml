name: Bug report
description: Report a reproducible issue in FRAMEZERO-owned tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach game packages, executables, keys, extracted assets, saves, or proprietary logs. Use synthetic test data only.
  - type: input
    id: component
    attributes:
      label: Affected component
      description: CLI, desktop console, diagnostics, tests, or documentation.
      placeholder: framezero_gui.py
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FRAMEZERO version or commit
      placeholder: 0.2.0-dev / commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant tool versions. Redact private paths and usernames.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe logs
      description: Remove local usernames, private paths, tokens, and all proprietary game data.
    validations:
      required: true
